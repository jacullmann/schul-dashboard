name: schul-dashboard

services:
  db:
    build: ./database
    image: schul-dashboard-database:local
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=postgres"]
    environment:
      POSTGRES_PASSWORD: postgres
    # Loopback only: the dev credentials above must never be reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--dbname=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
