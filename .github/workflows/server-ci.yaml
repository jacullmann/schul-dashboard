name: Server CI

on:
  pull_request:
    paths:
      - 'server/**'
      - 'database/**'
      - 'compose.yaml'
      - '.github/workflows/server-ci.yaml'
  push:
    branches: ["main"]
    paths:
      - 'server/**'
      - 'database/**'
      - 'compose.yaml'
      - '.github/workflows/server-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlx-cache:
    name: Verify sqlx query cache
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start database
        run: docker compose up --detach --wait db

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls

      - name: Apply migrations
        working-directory: server
        run: cargo sqlx migrate run

      - name: Check query cache is up to date
        working-directory: server
        run: cargo sqlx prepare --check
