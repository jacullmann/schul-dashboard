<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex, nofollow" />

    <title>schul-dashboard</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />

    <script>
        // Applied before first paint so the loading screen matches the theme useTheme() will restore,
        // instead of flashing the wrong canvas color. Keep the storage key in sync with useTheme.ts.
        (function () {
            var preference = null;
            try {
                preference = localStorage.getItem('theme-preference2gl');
            } catch (e) {}
            var isDark = preference === 'dark'
                || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
        })();
    </script>

    <style>
        :root {
            --initial-loading-canvas: oklch(1 0 0);
            --initial-loading-ink: oklch(0.1684 0 0);
            --initial-loading-track: oklch(0 0 0 / 7%);
            --initial-loading-mark-body: oklch(0.1684 0 0);
            --initial-loading-mark-detail: oklch(1 0 0);
            --initial-loading-glow-opacity: 0.18;
            --initial-loading-bismuth: linear-gradient(
                116deg,
                oklch(0.8003 0.1668 71.67) 2.5%,
                oklch(0.6541 0.2345 17.07) 39.5%,
                oklch(0.5878 0.29968 308.4769) 77.2%,
                oklch(0.4898 0.295776 280.2478) 115.2%
            );
            --initial-loading-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }

        html.dark {
            --initial-loading-canvas: oklch(0.1684 0 0);
            --initial-loading-ink: oklch(1 0 0);
            --initial-loading-track: oklch(1 0 0 / 11%);
            --initial-loading-mark-body: oklch(1 0 0);
            --initial-loading-mark-detail: oklch(0.1684 0 0);
            --initial-loading-glow-opacity: 0.32;
        }

        html,
        body {
            background: var(--initial-loading-canvas);
        }

        #initial-loading-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: grid;
            place-items: center;
            background: var(--initial-loading-canvas);
            transition: opacity 400ms ease, visibility 0s linear 400ms;
        }

        #initial-loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .initial-loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: initial-loading-enter 600ms var(--initial-loading-ease-out) 150ms forwards;
            transition: transform 400ms var(--initial-loading-ease-out);
        }

        #initial-loading-screen.hidden .initial-loading-content {
            transform: scale(0.96);
        }

        .initial-loading-mark {
            position: relative;
            width: 64px;
            height: 64px;
            animation: initial-loading-float 2.8s ease-in-out infinite;
        }

        .initial-loading-mark::before {
            content: '';
            position: absolute;
            inset: -24px;
            z-index: -1;
            border-radius: 50%;
            background: var(--initial-loading-bismuth);
            filter: blur(28px);
            opacity: var(--initial-loading-glow-opacity);
            animation: initial-loading-glow 2.8s ease-in-out infinite;
        }

        .initial-loading-mark svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .initial-loading-mark .mark-body {
            fill: var(--initial-loading-mark-body);
        }

        .initial-loading-mark .mark-detail {
            fill: var(--initial-loading-mark-detail);
        }

        .initial-loading-label {
            margin-top: 24px;
            font-family: 'Satoshi', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--initial-loading-ink);
        }

        .initial-loading-progress {
            position: relative;
            width: 112px;
            height: 3px;
            margin-top: 16px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--initial-loading-track);
        }

        .initial-loading-progress::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 40%;
            border-radius: inherit;
            background: var(--initial-loading-bismuth);
            animation: initial-loading-slide 1.4s ease-in-out infinite;
        }

        .initial-loading-sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @keyframes initial-loading-enter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes initial-loading-float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes initial-loading-glow {
            0%,
            100% {
                transform: scale(0.9);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes initial-loading-slide {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(250%);
            }
        }

        @keyframes initial-loading-pulse {
            0%,
            100% {
                opacity: 0.35;
            }
            50% {
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .initial-loading-content {
                animation-duration: 1ms;
            }

            .initial-loading-mark,
            .initial-loading-mark::before {
                animation: none;
            }

            .initial-loading-progress::after {
                width: 100%;
                animation: initial-loading-pulse 1.6s ease-in-out infinite;
            }
        }
    </style>
</head>
<body>

</div>

<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
<script>
    window.__removeInitialLoadingScreen = function() {
        const loader = document.getElementById('initial-loading-screen');
        if (loader) {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 500);
        }
    };
</script>
